<g>
  <line class="lidar-ray" x1="152" y1="120" x2="80"  y2="96"  stroke="#378ADD" stroke-width="0.8"/>
  <line class="lidar-ray" x1="152" y1="120" x2="90"  y2="76"  stroke="#378ADD" stroke-width="0.8"/>
  <line class="lidar-ray" x1="152" y1="120" x2="115" y2="70"  stroke="#378ADD" stroke-width="0.8"/>
  <line class="lidar-ray" x1="152" y1="120" x2="145" y2="70"  stroke="#378ADD" stroke-width="0.8"/>
  <line class="lidar-ray" x1="152" y1="120" x2="175" y2="72"  stroke="#378ADD" stroke-width="0.8"/>
  <line class="lidar-ray" x1="152" y1="120" x2="204" y2="80"  stroke="#378ADD" stroke-width="0.8"/>
  <line class="lidar-ray" x1="152" y1="120" x2="210" y2="112" stroke="#378ADD" stroke-width="0.8"/>
  <line class="lidar-ray" x1="152" y1="120" x2="208" y2="132" stroke="#378ADD" stroke-width="0.8"/>
