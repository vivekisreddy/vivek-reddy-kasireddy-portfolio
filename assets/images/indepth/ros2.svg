<line x1="274" y1="56"  x2="304" y2="86"  stroke="#9b9990" stroke-width="0.6" opacity="0.4"/>
<line x1="210" y1="80"  x2="276" y2="150" stroke="#9b9990" stroke-width="0.6" opacity="0.4"/>
<line x1="210" y1="104" x2="258" y2="150" stroke="#9b9990" stroke-width="0.6" opacity="0.4"/>
<line x1="210" y1="128" x2="240" y2="150" stroke="#9b9990" stroke-width="0.6" opacity="0.4"/>
<text x="257" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#5F5E5A" opacity="0.7">unknown</text>

<!-- Walls -->
<rect x="40"  y="56"  width="16"  height="264" rx="2" fill="#0C447C" opacity="0.6"/>
<rect x="40"  y="304" width="264" height="16"  rx="2" fill="#0C447C" opacity="0.6"/>
