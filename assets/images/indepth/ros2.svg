<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>ROS 2 SLAM Mapping and AMCL Localization</title>
<desc>Two-phase illustration: left shows a TurtleBot3 building an occupancy grid map via SLAM, right shows the robot localizing with AMCL particle filter and navigating to a goal.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-sm" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>

  <style>
    /* ── Exploration path draw-on ── */
    .explore-path {
      stroke-dasharray: 320;
      stroke-dashoffset: 320;
      animation: draw-path 2.8s ease forwards 0.4s;
    }
    @keyframes draw-path {
      to { stroke-dashoffset: 0; }
    }

    /* ── LiDAR rays pulse ── */
    .lidar-ray {
      opacity: 0;
      animation: ray-pulse 2s ease-in-out infinite;
    }
    .lidar-ray:nth-child(1)  { animation-delay: 0.0s; }
    .lidar-ray:nth-child(2)  { animation-delay: 0.1s; }
    .lidar-ray:nth-child(3)  { animation-delay: 0.2s; }
    .lidar-ray:nth-child(4)  { animation-delay: 0.3s; }
    .lidar-ray:nth-child(5)  { animation-delay: 0.4s; }
    .lidar-ray:nth-child(6)  { animation-delay: 0.5s; }
    .lidar-ray:nth-child(7)  { animation-delay: 0.6s; }
    .lidar-ray:nth-child(8)  { animation-delay: 0.7s; }
    .lidar-ray:nth-child(9)  { animation-delay: 0.8s; }
    .lidar-ray:nth-child(10) { animation-delay: 0.9s; }
    .lidar-ray:nth-child(11) { animation-delay: 1.0s; }
    @keyframes ray-pulse {
      0%   { opacity: 0; }
      30%  { opacity: 0.5; }
      60%  { opacity: 0.5; }
      100% { opacity: 0; }
    }

    /* ── Robot pulse ring ── */
    .robot-ring {
      animation: ring-pulse 2s ease-out infinite;
      transform-origin: 152px 120px;
    }
    @keyframes ring-pulse {
      0%   { r: 14; opacity: 0.35; }
      100% { r: 28; opacity: 0; }
    }

    /* ── Frontier cell blink ── */
    .frontier {
      animation: frontier-blink 1.4s ease-in-out infinite;
    }
    .frontier:nth-child(2) { animation-delay: 0.2s; }
    .frontier:nth-child(3) { animation-delay: 0.4s; }
    @keyframes frontier-blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ── AMCL particles drift ── */
    .particle {
      animation: particle-drift 3s ease-in-out infinite alternate;
    }
    .particle:nth-child(odd)  { animation-duration: 2.6s; }
    .particle:nth-child(even) { animation-duration: 3.4s; }
    @keyframes particle-drift {
      0%   { transform: translate(0, 0); }
      100% { transform: translate(2px, -2px); }
    }

    /* ── Particle cloud converge ── */
    .particle-outer {
      animation: converge 3s ease-in-out infinite alternate;
      transform-origin: 476px 300px;
    }
    @keyframes converge {
      0%   { opacity: 0.5; transform: scale(1.15); }
      100% { opacity: 1;   transform: scale(0.9); }
    }

    /* ── Planned path dash march ── */
    .nav-path {
      stroke-dasharray: 9 3;
      animation: march 1s linear infinite;
    }
    @keyframes march {
      to { stroke-dashoffset: -12; }
    }

    /* ── Goal marker pulse ── */
    .goal-ring {
      animation: goal-pulse 1.8s ease-out infinite;
      transform-origin: 558px 150px;
    }
    @keyframes goal-pulse {
      0%   { r: 13; opacity: 0.5; }
      100% { r: 24; opacity: 0; }
    }

    /* ── Right-side LiDAR rays rotate ── */
    .lidar-ray-r {
      opacity: 0;
      animation: ray-pulse-r 2.4s ease-in-out infinite;
    }
    .lidar-ray-r:nth-child(1)  { animation-delay: 0.00s; }
    .lidar-ray-r:nth-child(2)  { animation-delay: 0.15s; }
    .lidar-ray-r:nth-child(3)  { animation-delay: 0.30s; }
    .lidar-ray-r:nth-child(4)  { animation-delay: 0.45s; }
    .lidar-ray-r:nth-child(5)  { animation-delay: 0.60s; }
    .lidar-ray-r:nth-child(6)  { animation-delay: 0.75s; }
    .lidar-ray-r:nth-child(7)  { animation-delay: 0.90s; }
    .lidar-ray-r:nth-child(8)  { animation-delay: 1.05s; }
    .lidar-ray-r:nth-child(9)  { animation-delay: 1.20s; }
    .lidar-ray-r:nth-child(10) { animation-delay: 1.35s; }
    @keyframes ray-pulse-r {
      0%   { opacity: 0; }
      25%  { opacity: 0.4; }
      55%  { opacity: 0.4; }
      100% { opacity: 0; }
    }

    /* ── Robot heading bob ── */
    .robot-heading {
      animation: heading-bob 2s ease-in-out infinite;
      transform-origin: 476px 300px;
    }
    @keyframes heading-bob {
      0%, 100% { transform: rotate(-5deg); }
      50%       { transform: rotate(5deg); }
    }

    /* ── fade-in panel labels ── */
    .fade-label {
      opacity: 0;
      animation: fade-in 0.8s ease forwards;
    }
    .fade-label.d1 { animation-delay: 0.2s; }
    .fade-label.d2 { animation-delay: 0.4s; }
    .fade-label.d3 { animation-delay: 0.6s; }
    .fade-label.d4 { animation-delay: 0.8s; }
    .fade-label.d5 { animation-delay: 1.0s; }
    .fade-label.d6 { animation-delay: 1.2s; }
    @keyframes fade-in {
      to { opacity: 1; }
    }
  </style>
</defs>

<!-- ── BACKGROUNDS ── -->
<rect x="0"   y="0" width="335" height="400" fill="#E6F1FB" opacity="0.22"/>
<rect x="345" y="0" width="335" height="400" fill="#E1F5EE" opacity="0.22"/>
<line x1="340" y1="24" x2="340" y2="376" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="4 4"/>

<!-- ── PHASE LABELS ── -->
<rect class="fade-label d1" x="24" y="16" width="148" height="26" rx="5" fill="#185FA5" opacity="0.12"/>
<text class="fade-label d1" x="98" y="33" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#0C447C">SLAM Mapping</text>

<rect class="fade-label d2" x="360" y="16" width="168" height="26" rx="5" fill="#0F6E56" opacity="0.12"/>
<text class="fade-label d2" x="444" y="33" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#085041">Localization &amp; Nav</text>

