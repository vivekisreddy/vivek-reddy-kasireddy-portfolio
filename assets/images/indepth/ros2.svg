  <line class="lidar-ray" x1="152" y1="120" x2="80"  y2="190" stroke="#378ADD" stroke-width="0.8"/>
</g>

<!-- Robot pulse ring -->
<circle class="robot-ring" cx="152" cy="120" r="14" fill="none" stroke="#185FA5" stroke-width="1.2"/>
<!-- Robot body -->
<circle cx="152" cy="120" r="14" fill="#185FA5" opacity="0.2" stroke="#185FA5" stroke-width="1"/>
<circle cx="152" cy="120" r="9"  fill="#185FA5" opacity="0.9"/>
<circle cx="152" cy="120" r="4"  fill="#E6F1FB"/>
<line x1="152" y1="120" x2="152" y2="96" stroke="#0C447C" stroke-width="1.5" marker-end="url(#arrow-sm)"/>

<!-- Left bottom labels -->
<text class="fade-label d4" x="162" y="298" font-family="system-ui,sans-serif" font-size="11" fill="#185FA5">/map (OccupancyGrid)</text>
<rect class="fade-label d5" x="48"  y="336" width="104" height="22" rx="4" fill="#185FA5" opacity="0.12"/>
<text class="fade-label d5" x="100" y="351" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">SLAM Toolbox</text>
<rect class="fade-label d6" x="164" y="336" width="118" height="22" rx="4" fill="#E85D24" opacity="0.12"/>
<text class="fade-label d6" x="223" y="351" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#993C1D">FrontierExplorer</text>

