<!-- Frontier cells -->
<g class="frontier"><rect x="210" y="148" width="18" height="18" rx="2" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="3 2"/></g>
<g class="frontier"><rect x="228" y="148" width="18" height="18" rx="2" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="3 2"/></g>
