<svg width="100%" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How event cameras work — asynchronous pixel events vs frame camera motion blur</title>
<desc>Top row shows how event cameras detect changes in log intensity per pixel asynchronously, generating a scatter of dots only where motion occurs. Bottom row compares frame camera blur vs event camera sharp output for a moving warehouse pallet.</desc>

<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    /* Dot scatter — random pixels firing */
    .dot { animation: dot-fire 2s ease-in-out infinite; opacity: 0; }
    .dot:nth-child(1)  { animation-delay:0.00s; } .dot:nth-child(2)  { animation-delay:0.07s; }
    .dot:nth-child(3)  { animation-delay:0.14s; } .dot:nth-child(4)  { animation-delay:0.21s; }
    .dot:nth-child(5)  { animation-delay:0.28s; } .dot:nth-child(6)  { animation-delay:0.35s; }
    .dot:nth-child(7)  { animation-delay:0.42s; } .dot:nth-child(8)  { animation-delay:0.49s; }
    .dot:nth-child(9)  { animation-delay:0.56s; } .dot:nth-child(10) { animation-delay:0.63s; }
    .dot:nth-child(11) { animation-delay:0.70s; } .dot:nth-child(12) { animation-delay:0.77s; }
    .dot:nth-child(13) { animation-delay:0.84s; } .dot:nth-child(14) { animation-delay:0.91s; }
    .dot:nth-child(15) { animation-delay:0.98s; } .dot:nth-child(16) { animation-delay:1.05s; }
    .dot:nth-child(17) { animation-delay:1.12s; } .dot:nth-child(18) { animation-delay:1.19s; }
    .dot:nth-child(19) { animation-delay:1.26s; } .dot:nth-child(20) { animation-delay:1.33s; }
    .dot:nth-child(21) { animation-delay:1.40s; } .dot:nth-child(22) { animation-delay:1.47s; }
    .dot:nth-child(23) { animation-delay:1.54s; } .dot:nth-child(24) { animation-delay:0.10s; }
    .dot:nth-child(25) { animation-delay:0.33s; } .dot:nth-child(26) { animation-delay:0.66s; }
    .dot:nth-child(27) { animation-delay:0.99s; } .dot:nth-child(28) { animation-delay:1.20s; }
    .dot:nth-child(29) { animation-delay:0.45s; } .dot:nth-child(30) { animation-delay:0.85s; }
    @keyframes dot-fire {
      0%   { opacity: 0; }
      12%  { opacity: 1; }
      28%  { opacity: 0; }
      100% { opacity: 0; }
    }

    /* Pos events = blue/teal, neg events = red/coral */
    .dot-pos { fill: #1D9E75; }
    .dot-neg { fill: #E24B4A; }

    /* Blur trail on frame camera pallet */
    .blur-pallet { animation: blur-move 2.4s ease-in-out infinite alternate; }
    @keyframes blur-move { 0% { transform:translateX(0); opacity:0.85; } 100% { transform:translateX(30px); opacity:0.4; } }
    .blur-ghost  { animation: ghost-move 2.4s ease-in-out infinite alternate; }
    @keyframes ghost-move { 0% { transform:translateX(0); opacity:0; } 100% { transform:translateX(12px); opacity:0.3; } }

    /* Sharp pallet on event side */
    .sharp-pallet { animation: sharp-move 2.4s ease-in-out infinite alternate; }
    @keyframes sharp-move { 0% { transform:translateX(0); } 100% { transform:translateX(30px); } }

    /* Pixel grid on event camera view */
    .px { animation: px-pulse 1.8s ease-in-out infinite; opacity:0.08; }
    .px:nth-child(odd)  { animation-delay: 0.0s; }
    .px:nth-child(even) { animation-delay: 0.9s; }
    @keyframes px-pulse { 0%,100%{opacity:0.08;} 20%{opacity:1;} 40%{opacity:0.08;} }

    /* Static area — no events */
    .static-dot { opacity: 0.06; }

    /* Label fade */
    .lbl { opacity:0; animation: fin 0.5s ease forwards; }
    .lbl.d1{animation-delay:0.1s;} .lbl.d2{animation-delay:0.25s;}
    .lbl.d3{animation-delay:0.4s;} .lbl.d4{animation-delay:0.55s;}
    .lbl.d5{animation-delay:0.7s;} .lbl.d6{animation-delay:0.85s;}
    @keyframes fin { to { opacity:1; } }
  </style>
</defs>

